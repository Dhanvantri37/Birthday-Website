services:
  # Production build served via Nginx
  app:
    container_name: krishna-birthday-prod
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped

  # Local development service (with Hot Module Replacement support)
  dev:
    container_name: krishna-birthday-dev
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - WATCHPACK_POLLING=true # Useful for file change detection inside containers
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
